<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/planning" />
    </ion-buttons>
    <ion-title>{{ 'documents.titre' | translate }}</ion-title>
    <ion-buttons slot="end">
      @if (jauge()) {
        <ion-spinner name="circular" />
      }
      <ion-button [attr.aria-label]="'commun.wiki' | translate" (click)="wiki()">
        <ion-icon slot="icon-only" name="help-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="disposition" [class.large]="large()">
    <div class="liste">
      @if (documents().length) {
        <div class="carte">
          @for (doc of documents(); track $index; let i = $index) {
            <button type="button" class="document" [class.non-lu]="doc.nonLu" (click)="selectionner(i)">
              <span class="tuile-icone rouge"><ion-icon name="document-text-outline" /></span>
              <span class="corps">
                <span class="nom">{{ doc.nom }}</span>
                <span class="type">{{ doc.type }}</span>
                <span class="dates">
                  <span>{{ 'documents.creation' | translate }} : {{ doc.creation }}</span>
                  <span>{{ 'documents.lecture' | translate }} : {{ doc.lecture }}</span>
                </span>
              </span>
              @if (doc.nonLu) {
                <span class="point-non-lu"></span>
              }
            </button>
          }
        </div>
      }
    </div>

    @if (large()) {
      <div class="visionneuse carte">
        @if (pdf(); as url) {
          <iframe [src]="url" title="PDF"></iframe>
        } @else if (placeholder()) {
          <div class="placeholder">
            <ion-icon name="document-text-outline" />
            <p>{{ 'documents.choisir' | translate }}</p>
          </div>
        }
      </div>
    }
  </div>
</ion-content>
