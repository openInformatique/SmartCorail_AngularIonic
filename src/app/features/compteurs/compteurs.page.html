<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>{{ 'compteurs.titre' | translate }}</ion-title>
    <ion-buttons slot="end">
      @if (jauge()) {
        <ion-spinner name="circular" />
      }
      <ion-button [attr.aria-label]="'commun.wiki' | translate" (click)="wiki()">
        <ion-icon slot="icon-only" name="help-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page compteurs">
    @for (ligne of lignes(); track $index) {
      @if (ligne.avecDetail) {
        <button type="button" class="carte compteur cliquable" [attr.aria-label]="'compteurs.details' | translate" (click)="details(ligne.idCompteur)">
          <ng-container *ngTemplateOutlet="contenu; context: { $implicit: ligne }" />
          <ion-icon class="chevron" name="chevron-forward" />
        </button>
      } @else {
        <div class="carte compteur">
          <ng-container *ngTemplateOutlet="contenu; context: { $implicit: ligne }" />
        </div>
      }
    }
  </div>
</ion-content>

<ng-template #contenu let-ligne>
  <span class="tuile-icone"><ion-icon name="speedometer-outline" /></span>
  <span class="corps">
    <span class="nom">{{ ligne.nom }}</span>
    <span class="valeur">
      <span class="nombre">{{ ligne.valeur }}</span>
      <span class="unite">{{ ligne.unite }}</span>
    </span>
  </span>
</ng-template>
