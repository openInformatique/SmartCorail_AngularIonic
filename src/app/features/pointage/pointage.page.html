<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>{{ 'pointage.titre' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [attr.aria-label]="'pointage.pdf' | translate" (click)="pdf()">
        <ion-icon slot="icon-only" name="document-text-outline" />
      </ion-button>
      <ion-button [attr.aria-label]="'commun.wiki' | translate" (click)="wiki()">
        <ion-icon slot="icon-only" name="help-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page">
    <div class="carte filtre">
      <ion-input
        type="date"
        fill="outline"
        labelPlacement="stacked"
        [label]="'planning.depuis' | translate"
        [ngModel]="dateDepuis()"
        (ngModelChange)="modifierDate($event)"
        (keyup.enter)="demandeMiseAJour()"
      />
      <ion-button class="valider" [disabled]="!actif()" (click)="demandeMiseAJour()">
        @if (jauge()) {
          <ion-spinner slot="icon-only" name="circular" />
        } @else {
          <ion-icon slot="icon-only" name="checkmark" />
        }
      </ion-button>
    </div>

    <div class="journees">
      @for (ligne of lignes(); track ligne.idLigne) {
        <button type="button" class="carte journee" [class.grise]="ligne.grise" (click)="ouvrir(ligne)">
          <span class="entete">
            <span class="date">{{ ligne.libelleDate }}</span>
            @if (ligne.verrou) {
              <ion-icon class="verrou" name="lock-closed" />
            }
          </span>
          <span class="jt"><ion-icon name="location-outline" />{{ ligne.jt }}</span>
          @if (ligne.nonAutorise || ligne.badgeuse) {
            <span class="etiquettes">
              @if (ligne.nonAutorise) {
                <span class="puce non-autorise">{{ 'pointage.nonAutorise' | translate }}</span>
              }
              @if (ligne.badgeuse) {
                <span class="puce badgeuse">{{ 'pointage.pointeParBadgeuse' | translate }}</span>
              }
            </span>
          }
          <!-- Frise : prise de poste, coupure, fin de poste -->
          <span class="frise">
            <span class="segment debut">
              <span class="heure">{{ ligne.hpDebut }}</span>
              <span class="etablissement">{{ ligne.etablissementDebut }}</span>
            </span>
            <span class="segment coupure">
              <span class="heure">{{ ligne.hpDebutCoupure }}</span>
              <span class="heure">{{ ligne.hpFinCoupure }}</span>
            </span>
            <span class="segment fin">
              <span class="heure">{{ ligne.hpFin }}</span>
              <span class="etablissement">{{ ligne.etablissementFin }}</span>
            </span>
          </span>
        </button>
      }
    </div>
  </div>
</ion-content>
