<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>{{ 'absences.titre' | translate }}</ion-title>
    <ion-buttons slot="end">
      @if (ajoutVisible()) {
        <ion-button [attr.aria-label]="'absences.nouvelle' | translate" (click)="ajouter()">
          <ion-icon slot="icon-only" name="add" />
        </ion-button>
      }
      <ion-button [attr.aria-label]="'commun.wiki' | translate" (click)="wiki()">
        <ion-icon slot="icon-only" name="help-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page">
    <div class="carte filtre">
      <ion-input
        type="date"
        fill="outline"
        labelPlacement="stacked"
        [label]="'planning.depuis' | translate"
        [ngModel]="dateDepuis()"
        (ngModelChange)="modifierDate($event)"
        (keyup.enter)="demandeMiseAJour()"
      />
      <ion-button class="valider" [disabled]="validerInactif()" (click)="demandeMiseAJour()">
        @if (jauge()) {
          <ion-spinner slot="icon-only" name="circular" />
        } @else {
          <ion-icon slot="icon-only" name="checkmark" />
        }
      </ion-button>
    </div>

    <div class="absences">
      @for (ligne of lignes(); track $index) {
        <button type="button" class="carte absence" (click)="selectionner(ligne.idAbsence)">
          <span class="tuile-icone"><ion-icon name="calendar-clear-outline" /></span>
          <span class="corps">
            <span class="entete">
              <span class="type">{{ ligne.type }}</span>
              <span class="puce statut">{{ ligne.statut }}</span>
            </span>
            <span class="dates"><ion-icon name="time-outline" />{{ ligne.dates }}</span>
            @if (ligne.commentaire) {
              <span class="commentaire">{{ ligne.commentaire }}</span>
            }
          </span>
          <ion-icon class="chevron" name="chevron-forward" />
        </button>
      }
    </div>
  </div>
</ion-content>
