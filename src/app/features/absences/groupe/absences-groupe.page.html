<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
    <ion-title>{{ 'absences.titreGroupe' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [attr.aria-label]="'commun.wiki' | translate" (click)="wiki()">
        <ion-icon slot="icon-only" name="help-circle-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page">
    <div class="carte periode">
      <span class="tuile-icone"><ion-icon name="people-outline" /></span>
      <ion-input
        type="date"
        fill="outline"
        labelPlacement="stacked"
        [label]="'absences.aPartirDu' | translate"
        [ngModel]="dateDu()"
        (ngModelChange)="dateDu.set($event ?? '')"
      />
      <ion-input
        type="date"
        fill="outline"
        labelPlacement="stacked"
        [label]="'absences.jusquAu' | translate"
        [ngModel]="dateAu()"
        (ngModelChange)="dateAu.set($event ?? '')"
      />
      <ion-button expand="block" [disabled]="validerInactif()" (click)="valider()">
        @if (jauge()) {
          <ion-spinner slot="start" name="circular" />
        }
        {{ 'absences.afficher' | translate }}
      </ion-button>
    </div>
  </div>
</ion-content>
